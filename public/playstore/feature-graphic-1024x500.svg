<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FA"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5ECF8"/>
    </linearGradient>
    <linearGradient id="brandGradient" x1="95" y1="58" x2="215" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4405F"/>
      <stop offset="1" stop-color="#C13584"/>
    </linearGradient>
    <linearGradient id="phoneGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#667EEA"/>
      <stop offset="1" stop-color="#764BA2"/>
    </linearGradient>
    <linearGradient id="ctaGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E4405F"/>
      <stop offset="1" stop-color="#C13584"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="200%" height="200%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="phoneShadow" x="0" y="0" width="200%" height="200%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1024" height="500" rx="0" fill="url(#bgGradient)"/>

  <circle cx="130" cy="80" r="90" fill="#E4405F" fill-opacity="0.10"/>
  <circle cx="940" cy="430" r="120" fill="#C13584" fill-opacity="0.10"/>

  <g>
    <rect x="64" y="54" width="46" height="46" rx="14" fill="url(#ctaGradient)"/>
    <path d="M79 77L87.5 66L96 77L87.5 88L79 77Z" fill="white"/>
    <text x="124" y="72" fill="#1A1A1A" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="800">Axil</text>
    <text x="186" y="72" fill="url(#brandGradient)" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="800">Tree</text>
  </g>

  <text x="64" y="150" fill="#1A1A1A" font-size="52" font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="-1.2">
    One Bio Link for Everything
  </text>

  <text x="64" y="196" fill="#5F6368" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="500">
    Create, customize, and share your link page in minutes.
  </text>

  <g filter="url(#softShadow)">
    <rect x="64" y="236" width="530" height="190" rx="28" fill="#FFFFFF"/>
  </g>

  <g>
    <rect x="92" y="270" width="12" height="12" rx="6" fill="#E4405F"/>
    <text x="116" y="282" fill="#202124" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Custom username &amp; profile</text>

    <rect x="92" y="316" width="12" height="12" rx="6" fill="#C13584"/>
    <text x="116" y="328" fill="#202124" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Drag &amp; drop link management</text>

    <rect x="92" y="362" width="12" height="12" rx="6" fill="#764BA2"/>
    <text x="116" y="374" fill="#202124" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Themes, fonts, and analytics</text>
  </g>

  <g filter="url(#phoneShadow)">
    <rect x="722" y="68" width="226" height="364" rx="44" fill="url(#phoneGradient)"/>
  </g>

  <rect x="741" y="88" width="188" height="324" rx="32" fill="#FDFBFF"/>
  <rect x="800" y="80" width="70" height="10" rx="5" fill="#1A1A1A"/>

  <circle cx="835" cy="136" r="26" fill="#E4405F" fill-opacity="0.18"/>
  <text x="803" y="180" fill="#1A1A1A" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">@yourname</text>

  <rect x="768" y="202" width="132" height="34" rx="17" fill="url(#ctaGradient)"/>
  <text x="810" y="224" text-anchor="middle" fill="white" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">My Store</text>

  <rect x="768" y="248" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#E4E6EB"/>
  <text x="812" y="270" text-anchor="middle" fill="#3C4043" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="600">YouTube</text>

  <rect x="768" y="294" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#E4E6EB"/>
  <text x="812" y="316" text-anchor="middle" fill="#3C4043" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="600">Instagram</text>

  <rect x="768" y="340" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#E4E6EB"/>
  <text x="812" y="362" text-anchor="middle" fill="#3C4043" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="600">Contact</text>

  <rect x="64" y="446" width="344" height="36" rx="18" fill="#FFFFFF" stroke="#EDEDED"/>
  <text x="236" y="469" text-anchor="middle" fill="#5F6368" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">Free forever • Setup in minutes</text>
</svg>
